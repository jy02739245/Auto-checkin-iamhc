name: iamhc Daily Checkin

on:
  schedule:
    # 每天 UTC 23:17 运行（即北京时间次日 07:17）
    - cron: '17 23 * * *'
  workflow_dispatch: # 支持手动触发

# 同一时间只允许一个签到任务运行
concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: read
    env:
      NODE_LINK: ${{ secrets.NODE_LINK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # xvfb: UC 模式需要真实显示，不能用 headless
          # xauth: SeleniumBase 用 use_xauth 起 Xvfb，缺了会退化到备用路径
          # python3-tk / scrot / x11-utils: PyAutoGUI 在 Linux 上的运行依赖
          sudo apt-get install -y \
            xvfb xauth x11-utils xdotool scrot python3-tk \
            fontconfig fonts-noto-cjk fonts-noto-color-emoji
          sudo fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sbase get uc_driver

      - name: Install sing-box for NODE_LINK proxy
        if: env.NODE_LINK != ''
        env:
          SING_BOX_VERSION: '1.14.0'
          SING_BOX_SHA256: '2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63'
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 \
            -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          echo "${SING_BOX_SHA256}  /tmp/sing-box.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Verify browser, fonts and GUI deps
        run: |
          which google-chrome || which google-chrome-stable || true
          google-chrome --version || google-chrome-stable --version || true
          fc-match sans:lang=zh-cn
          # PyAutoGUI 的点击链路依赖 tkinter + Xlib，缺任何一个都要在这一步就暴露
          python -c "import tkinter; print('tkinter ok')"
          xvfb-run -a python -c "import pyautogui; print('pyautogui ok', pyautogui.size())"

      - name: Run checkin
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONUNBUFFERED: '1'
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          # 不套 xvfb-run：SeleniumBase 的 UC 模式会自己拉起 Xvfb，
          # 并把 PyAutoGUI 的 X11 display 绑到同一个屏幕上
          python checkin.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: clear old run jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "deleted: $run_id"
              gh run delete $run_id || true
            fi
          done
